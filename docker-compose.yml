services:
  staff:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: studio-hamy-staff-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "300"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - staff_node_modules:/app/node_modules

volumes:
  staff_node_modules:
